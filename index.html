<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Моніторинг — Доброслав</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body,#map{
    width:100%;
    height:100%;
    margin:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    overflow:hidden;
}

#map{
    position:absolute;
    inset:0;
    background:#dfe7eb;
}

.panel{
    position:absolute;
    z-index:1000;
    top:16px;
    left:16px;
    width:360px;
    max-width:calc(100vw - 32px);
    padding:18px;
    color:white;
    background:rgba(20,20,20,.91);
    border-radius:16px;
    box-shadow:0 5px 25px rgba(0,0,0,.35);
}

.title{
    font-size:25px;
    font-weight:700;
    line-height:1.1;
}

.subtitle{
    color:#bbb;
    font-size:15px;
    margin-top:8px;
    margin-bottom:15px;
}

.status{
    padding:12px;
    border-radius:10px;
    background:#145c31;
    margin-bottom:15px;
    font-size:15px;
}

button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:13px;
    margin-top:9px;
    font-size:17px;
    color:white;
    background:#2871e6;
}

button.secondary{
    background:#4b5563;
}

.info{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#172235;
    font-size:14px;
    line-height:1.55;
}

.legend{
    border-top:1px solid #555;
    margin-top:15px;
    padding-top:13px;
    font-size:14px;
    line-height:1.9;
}

.dot{
    display:inline-block;
    width:12px;
    height:12px;
    border-radius:50%;
    margin-right:8px;
}

.green{background:#22c55e}
.red{background:#ef4444}
.yellow{background:#ffd000}
.orange{background:#ff9800}
.blue{background:#29a8ef}

.version{
    position:absolute;
    z-index:1000;
    left:20px;
    bottom:20px;
    background:rgba(20,20,20,.9);
    color:white;
    padding:9px 14px;
    border-radius:8px;
    font-size:13px;
}

.target{
    width:27px;
    height:27px;
    background:#ef4444;
    border:4px solid white;
    border-radius:50%;
    box-shadow:0 0 14px rgba(255,0,0,.85);
}

.town{
    width:22px;
    height:22px;
    background:#22c55e;
    border:4px solid white;
    border-radius:50%;
    box-shadow:0 0 12px rgba(34,197,94,.8);
}

@media(max-width:700px){
    .panel{
        width:310px;
        padding:14px;
    }

    .title{
        font-size:21px;
    }

    button{
        padding:11px;
        font-size:15px;
    }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="panel">

<div class="title">
Моніторинг повітряної<br>обстановки
</div>

<div class="subtitle">
Доброславська територіальна громада
</div>

<div id="status" class="status">
● Карта працює — тестовий режим
</div>

<button onclick="addTarget()">
+ Додати тестову ціль
</button>

<button class="secondary" onclick="clearTargets()">
Очистити цілі
</button>

<button class="secondary" onclick="showDobroslav()">
Показати Доброслав
</button>

<div id="info" class="info">
Цілей на карті: 0<br>
Жовта зона: 20 км<br>
Помаранчева зона: 50 км
</div>

<div class="legend">
<div><span class="dot green"></span>Доброслав</div>
<div><span class="dot red"></span>Тестова повітряна ціль</div>
<div><span class="dot yellow"></span>20 км</div>
<div><span class="dot orange"></span>50 км</div>
<div><span class="dot blue"></span>Умовний напрямок</div>
</div>

</div>

<div class="version">
Версія 2.3 — тестовий режим
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const DOBROSLAV=[46.82,30.95];

const map=L.map("map",{
    zoomControl:true
}).setView(DOBROSLAV,9);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
    maxZoom:19,
    attribution:"© OpenStreetMap contributors"
}).addTo(map);


/* ДОБРОСЛАВ */

const townIcon=L.divIcon({
    className:"",
    html:'<div class="town"></div>',
    iconSize:[30,30],
    iconAnchor:[15,15]
});

const town=L.marker(
    DOBROSLAV,
    {icon:townIcon}
).addTo(map);

town.bindTooltip(
    "Доброслав",
    {
        permanent:true,
        direction:"right"
    }
);


/* ЗОНИ */

L.circle(DOBROSLAV,{
    radius:20000,
    color:"#ffd000",
    weight:3,
    fillOpacity:.025
}).addTo(map);

L.circle(DOBROSLAV,{
    radius:50000,
    color:"#ff9800",
    weight:2,
    fillOpacity:.015
}).addTo(map);


/* УМОВНІ НАПРЯМКИ */

[
    [46.82,31.55],
    [46.82,30.10],
    [47.45,30.95],
    [46.20,30.95]
].forEach(point=>{

    L.polyline(
        [DOBROSLAV,point],
        {
            color:"#29a8ef",
            weight:3,
            dashArray:"10,10",
            opacity:.65
        }
    ).addTo(map);

});


let targets=[];
let targetCounter=0;


/* ВІДСТАНЬ */

function distanceKm(a,b){

    const R=6371;

    const lat1=a.lat*Math.PI/180;
    const lat2=b.lat*Math.PI/180;

    const dLat=(b.lat-a.lat)*Math.PI/180;
    const dLon=(b.lng-a.lng)*Math.PI/180;

    const x=
        Math.sin(dLat/2)*Math.sin(dLat/2)+
        Math.cos(lat1)*Math.cos(lat2)*
        Math.sin(dLon/2)*Math.sin(dLon/2);

    const c=
        2*Math.atan2(
            Math.sqrt(x),
            Math.sqrt(1-x)
        );

    return R*c;
}


/* СТАТУС ЗОНИ */

function zoneStatus(distance){

    if(distance<=20){
        return "ЗОНА 20 КМ";
    }

    if(distance<=50){
        return "ЗОНА 50 КМ";
    }

    return "ПОЗА 50 КМ";
}


/* ІНФОРМАЦІЯ */

function updateInfo(){

    document.getElementById("info").innerHTML=
        "Цілей на карті: "+targets.length+
        "<br>Жовта зона: 20 км"+
        "<br>Помаранчева зона: 50 км";

}


/* ОНОВЛЕННЯ ЦІЛІ */

function updateTarget(target){

    const pos=target.marker.getLatLng();

    const distance=
        distanceKm(
            {lat:DOBROSLAV[0],lng:DOBROSLAV[1]},
            pos
        );

    const zone=zoneStatus(distance);

    target.line.setLatLngs([
        DOBROSLAV,
        [pos.lat,pos.lng]
    ]);

    target.marker.setTooltipContent(
        "Ціль №"+target.number+
        " · "+distance.toFixed(1)+" км"+
        "<br>"+zone
    );

    let statusColor="#374151";

    if(distance<=20){
        statusColor="#991b1b";
    }
    else if(distance<=50){
        statusColor="#9a6700";
    }

    const status=document.getElementById("status");

    status.innerHTML=
        "● Ціль №"+target.number+
        " — "+distance.toFixed(1)+" км"+
        "<br>"+zone;

    status.style.background=statusColor;
}


/* ДОДАТИ ЦІЛЬ */

function addTarget(){

    targetCounter++;

    /*
       Тестова позиція.
       Це НЕ реальна повітряна ціль.
    */

    const angle=Math.random()*Math.PI*2;

    const distance=
        0.30+
        Math.random()*0.45;

    const lat=
        DOBROSLAV[0]+
        Math.cos(angle)*distance;

    const lng=
        DOBROSLAV[1]+
        Math.sin(angle)*distance;


    const targetIcon=L.divIcon({
        className:"",
        html:'<div class="target"></div>',
        iconSize:[35,35],
        iconAnchor:[17,17]
    });


    const marker=L.marker(
        [lat,lng],
        {
            icon:targetIcon,
            draggable:true
        }
    ).addTo(map);


    const line=L.polyline(
        [
            DOBROSLAV,
            [lat,lng]
        ],
        {
            color:"#ef4444",
            weight:2,
            dashArray:"6,7",
            opacity:.75
        }
    ).addTo(map);


    const target={
        number:targetCounter,
        marker:marker,
        line:line
    };

    targets.push(target);


    marker.bindTooltip(
        "",
        {
            permanent:true,
            direction:"top",
            offset:[0,-14]
        }
    );


    marker.on("drag",function(){

        updateTarget(target);

    });


    marker.on("dragend",function(){

        updateTarget(target);

    });


    updateTarget(target);
    updateInfo();

}


/* ОЧИСТИТИ */

function clearTargets(){

    targets.forEach(target=>{

        map.removeLayer(target.marker);
        map.removeLayer(target.line);

    });

    targets=[];

    document.getElementById("status").innerHTML=
        "● Цілі очищено — тестовий режим";

    document.getElementById("status").style.background=
        "#145c31";

    updateInfo();

}


/* ДОБРОСЛАВ */

function showDobroslav(){

    map.setView(DOBROSLAV,10);

    town.openTooltip();

}


/* ЗАПУСК */

updateInfo();

map.whenReady(function(){

    document.getElementById("status").innerHTML=
        "● Карта працює — тестовий режим";

});

</script>

</body>
</html>
