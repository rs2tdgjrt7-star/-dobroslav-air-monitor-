<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Доброслав — Моніторинг 2.1</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;width:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
#map{background:#e5e7eb}
.panel{position:absolute;z-index:1000;top:12px;left:12px;width:min(300px,calc(100vw - 48px));padding:14px;
background:rgba(17,24,39,.94);color:#fff;border-radius:14px;box-shadow:0 4px 18px #0007}
h1{font-size:18px;margin:0 0 3px}.sub{font-size:12px;color:#cbd5e1;margin-bottom:10px}
.status{background:#173b25;border-radius:8px;padding:8px;margin-bottom:10px;font-size:13px}
button{width:100%;border:0;border-radius:9px;padding:10px;margin-top:6px;background:#2563eb;color:white;font-size:14px}
button.gray{background:#4b5563}
.legend{font-size:12px;line-height:1.8;margin-top:10px;padding-top:8px;border-top:1px solid #4b5563}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.green{background:#22c55e}.red{background:#ef4444}.yellow{background:#facc15}.orange{background:#f97316}
.note{font-size:11px;color:#cbd5e1;margin-top:8px;line-height:1.35}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>Моніторинг — Доброслав</h1>
  <div class="sub">Онлайн-версія 2.1 · тестовий режим</div>
  <div id="status" class="status">● Завантаження карти…</div>
  <button onclick="centerTown()">Показати Доброслав</button>
  <button onclick="addTarget()">Додати тестову ціль</button>
  <button class="gray" onclick="clearTargets()">Очистити цілі</button>
  <div class="legend">
    <div><span class="dot green"></span>Доброслав</div>
    <div><span class="dot red"></span>Тестова ціль</div>
    <div><span class="dot yellow"></span>Радіус 20 км</div>
    <div><span class="dot orange"></span>Радіус 50 км</div>
  </div>
  <div class="note">Тестові цілі — лише демонстрація. Карта не показує реальні повітряні цілі.</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DOBROSLAV=[46.8200,30.9500];
const map=L.map("map",{zoomControl:true}).setView(DOBROSLAV,11);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19,
  attribution:"© OpenStreetMap contributors"
}).addTo(map);

const townIcon=L.divIcon({
 className:"",
 html:'<div style="width:20px;height:20px;border-radius:50%;background:#22c55e;border:3px solid white;box-shadow:0 0 12px #22c55e"></div>',
 iconSize:[20,20],iconAnchor:[10,10]
});
const targetIcon=L.divIcon({
 className:"",
 html:'<div style="width:24px;height:24px;border-radius:50%;background:#ef4444;border:3px solid white;box-shadow:0 0 14px #ef4444"></div>',
 iconSize:[24,24],iconAnchor:[12,12]
});

const town=L.marker(DOBROSLAV,{icon:townIcon}).addTo(map)
 .bindPopup("<b>Доброслав</b><br>Одеська область");

L.circle(DOBROSLAV,{radius:20000,color:"#facc15",weight:2,fillOpacity:.035}).addTo(map);
L.circle(DOBROSLAV,{radius:50000,color:"#f97316",weight:2,dashArray:"7 7",fillOpacity:0}).addTo(map);

let targets=[];
function setStatus(t){document.getElementById("status").textContent=t}
function centerTown(){map.setView(DOBROSLAV,11);town.openPopup();setStatus("● Центр карти — Доброслав")}
function addTarget(){
 const lat=DOBROSLAV[0]+(Math.random()*.45-.05);
 const lng=DOBROSLAV[1]+(Math.random()*.60-.05);
 const m=L.marker([lat,lng],{icon:targetIcon,draggable:true}).addTo(map);
 m.bindPopup("<b>Тестова ціль</b><br>Демонстраційний об'єкт.<br>Маркер можна перетягувати.");
 m.bindTooltip("Тестова ціль",{direction:"top"});
 targets.push(m); m.openPopup(); setStatus("● Тестову ціль додано");
}
function clearTargets(){targets.forEach(m=>map.removeLayer(m));targets=[];setStatus("● Тестові цілі очищено")}
map.whenReady(()=>setStatus("● Карта завантажена"));
</script>
</body>
</html>
